[package]
name = "template_cke"
version = "0.1.0"
authors = ["Chris Barnes <chrislloydbarnes@gmail.com>"]
rust-version = "1.85"
repository = "https://github.com/clbarnes/template_cke"
license = "MIT"
edition = "2024"
keywords = ["zarr", "chunk_key_encoding", "template"]
categories = ["data-structures", "parsing", "serialization", "text-processing"]

[dependencies]
inventory = { version = "0.3.24", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.12"
zarrs_chunk_key_encoding = { version = "0.2.0", optional = true }
zarrs_metadata = { version = "0.7.5", optional = true }
zarrs_plugin = { version = "0.4.1", optional = true }
zarrs_storage = { version = "0.4.4", optional = true }

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.151"

[[bench]]
name = "interpolate"
harness = false

[[bench]]
name = "parse"
harness = false

[features]
default = ["zarrs"]
zarrs = [
    "dep:serde",
    "dep:zarrs_chunk_key_encoding",
    "dep:zarrs_metadata",
    "dep:zarrs_plugin",
    "dep:zarrs_storage",
    "dep:inventory",
]

[workspace]
resolver = "3"
members = [".", "bindings/*"]
